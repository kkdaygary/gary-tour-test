<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>福岡五日 — 5天4夜行程誌（2027/3/9–3/13）</title>
<meta name="description" content="福岡 5 天 4 夜行程誌（2027/3/9–3/13）：博多屋台、太宰府柳川、由布院溫泉、別府地獄，附必吃清單、景點圖輯與實用提醒。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23F7F3EA'/%3E%3Ccircle cx='50' cy='50' r='27' fill='%23B9361F'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="assets/style.css?v=20261016" />
</head>
<body>

<header class="mast reveal" style="--i:0">
  <p class="mast-line mono">五天四夜行程誌 · 第一號 · 2027年3月9日–13日</p>
  <h1 class="mast-name">福岡五日<span class="latin">FUKUOKA ALMANAC</span></h1>
  <nav class="mast-nav" aria-label="章節導覽">
    <ul>
      <li><a href="#itinerary">行程</a></li>
      <li><a href="#news">情報</a></li>
      <li><a href="#eats">必吃</a></li>
      <li><a href="#plays">景點</a></li>
      <li><a href="#tips">提醒</a></li>
    </ul>
  </nav>
  <hr class="mast-rule" aria-hidden="true" />
  <button class="theme-toggle" id="themeToggle" aria-label="切換深淺色">◐</button>
</header>

<main class="wrap" id="main"></main>

<footer class="wrap">
  <div class="colophon" id="colophon"></div>
</footer>

<script src="assets/data.js"></script>
<script src="assets/credits.js"></script>
<script src="assets/extra.js"></script>
<script>
(function () {
  'use strict';

  var D = DESTINATIONS[0];
  var X = (typeof EXTRA !== 'undefined' && EXTRA[D.id]) ? EXTRA[D.id] : {};

  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  /* Wikimedia 圖片 */
  var CREDIT_INDEX = {};
  (typeof CREDITS !== 'undefined' ? CREDITS : []).forEach(function (c) {
    CREDIT_INDEX[c.slug] = c;
  });
  function imgUrl(slug, width) {
    var c = CREDIT_INDEX[slug];
    if (!c || !c.source) return '';
    var file = c.source.replace('https://commons.wikimedia.org/wiki/File:', '');
    return 'https://commons.wikimedia.org/wiki/Special:FilePath/' + file + '?width=' + (width || 1200);
  }

  /* 每日短標與照片 */
  var DAY_META = [
    { short: '屋台初夜', slug: 'yatai', cap: '中洲・那珂川沿岸的屋台街' },
    { short: '太宰府・柳川', slug: 'yanagawa', cap: '柳川・城下町水道的どんこ舟' },
    { short: '由布院溫泉', slug: 'yufuin', cap: '由布院・金鱗湖畔' },
    { short: '別府地獄', slug: 'beppu', cap: '別府・海地獄的鈷藍' },
    { short: '採買返程', slug: 'ohori-park', cap: '福岡・大濠公園' },
  ];

  /* 標題拆日期：「3/9（二）抵達・博多…」 */
  function splitTitle(t) {
    var m = t.match(/^(\d+\/\d+)（(.)）(.*)$/);
    return m ? { date: m[1], wd: m[2], rest: m[3] } : { date: '', wd: '', rest: t };
  }

  /* ── 開篇 ── */
  function opening() {
    var facts = Object.keys(D.facts).map(function (k) {
      return '<tr><th scope="row">' + esc(k) + '</th><td>' + esc(D.facts[k]) + '</td></tr>';
    }).join('');

    var index = D.itinerary.map(function (day, i) {
      var t = splitTitle(day.title);
      return '<a href="#day-' + day.day + '">'
        + '<span class="no">0' + day.day + ' · ' + esc(t.date) + ' 週' + esc(t.wd) + '</span>'
        + '<span>' + esc(DAY_META[i].short) + '</span>'
        + '<span class="arrow" aria-hidden="true">→</span></a>';
    }).join('');

    return '<figure class="cover reveal" style="--i:1">'
      + '<img src="' + imgUrl('fukuoka-hero', 1600) + '" alt="中洲屋台街夜景" fetchpriority="high" />'
      + '<figcaption><span>封面 · 中洲屋台街，日落後開張</span><span class="mono">HAKATA, FUKUOKA</span></figcaption>'
      + '</figure>'

      + '<div class="opening reveal" style="--i:2">'
      + '<div>'
      + '<p class="opening-statement">落地五分鐘，吃第一碗拉麵。</p>'
      + '<p class="opening-lede">' + esc(D.intro) + '</p>'
      + '<nav class="day-index" aria-label="每日行程索引">' + index + '</nav>'
      + '</div>'
      + '<table class="spec"><caption class="visually-hidden" style="display:none">旅行基本資料</caption>' + facts + '</table>'
      + '</div>';
  }

  /* ── F4 · 行程 ── */
  function itinerary() {
    var stages = D.itinerary.map(function (day, i) {
      var t = splitTitle(day.title);
      var meta = DAY_META[i];

      var blocks = day.blocks.map(function (b) {
        return '<div class="blk"><div class="when">' + esc(b.when) + '</div>'
          + '<div class="what">' + esc(b.text) + '</div></div>';
      }).join('');

      var foot = '';
      if (day.stay || day.tip) {
        foot = '<div class="stage-foot">'
          + (day.stay ? '<p><span class="lbl">住宿</span>' + esc(day.stay) + '</p>' : '')
          + (day.tip ? '<p><span class="lbl">小提醒</span>' + esc(day.tip) + '</p>' : '')
          + '</div>';
      }

      var photo = imgUrl(meta.slug, 900);
      var fig = photo
        ? '<figure class="stage-photo"><img src="' + photo + '" alt="' + esc(meta.cap) + '" loading="lazy" />'
          + '<figcaption>' + esc(meta.cap) + '</figcaption></figure>'
        : '';

      return '<article class="stage" id="day-' + day.day + '">'
        + '<header class="stage-head">'
        + '<p class="stage-no">DAY 0' + day.day + ' — ' + esc(t.date) + ' 週' + esc(t.wd) + '</p>'
        + '<h3 class="stage-title">' + esc(t.rest) + '</h3>'
        + '</header>'
        + '<div class="stage-blocks">' + blocks + '</div>'
        + fig
        + foot
        + '</article>';
    }).join('');

    return '<section class="section" id="itinerary">'
      + '<h2>五天怎麼走</h2>'
      + '<div>' + stages + '</div>'
      + '</section>';
  }

  /* ── 清單列 ── */
  function rows(items, opt) {
    opt = opt || {};
    return '<div class="list-rows">' + items.map(function (e) {
      var head = '<div class="row-head">'
        + (e.tag ? '<span class="tag">' + esc(e.tag) + '</span>' : '')
        + '<h3>' + esc(e.name || e.title) + '</h3>'
        + (e.jp ? '<span class="sub">' + esc(e.jp) + '</span>' : '')
        + (e.when ? '<span class="sub">' + esc(e.when) + '</span>' : '')
        + '</div>';
      var body = '<div class="row-body">' + esc(e.text)
        + (e.where ? '<span class="where">哪裡 — ' + esc(e.where) + '</span>' : '')
        + '</div>';
      return '<div class="row-item">' + head + body + '</div>';
    }).join('') + '</div>';
  }

  /* ── 情報（三月看點＋新開必知） ── */
  function news() {
    var s = (X.seasonal || []);
    var w = (X.whatsnew || []);
    return '<section class="section" id="news">'
      + '<h2>三月情報</h2>'
      + '<p class="section-note">花況與活動日期以官方最新公告為準，出發前再確認一次。</p>'
      + rows(s)
      + (w.length ? '<h3 class="sub-head">新開與必知</h3>' + rows(w) : '')
      + '</section>';
  }

  /* ── 必吃 ── */
  function eats() {
    var drinks = X.drinks || [];
    var souvenirs = X.souvenirs || [];
    var picks = X.foodPicks || [];
    return '<section class="section" id="eats">'
      + '<h2>必吃</h2>'
      + rows(D.eats)
      + (picks.length ? '<h3 class="sub-head">名店口袋清單</h3><div class="cols-2">'
        + picks.map(function (e) { return rows([e]); }).join('') + '</div>' : '')
      + (drinks.length ? '<h3 class="sub-head">喝什麼</h3><div class="cols-2">'
        + drinks.map(function (e) { return rows([e]); }).join('') + '</div>' : '')
      + (souvenirs.length ? '<h3 class="sub-head">伴手禮</h3><div class="cols-2">'
        + souvenirs.map(function (e) { return rows([e]); }).join('') + '</div>' : '')
      + '</section>';
  }

  /* ── 景點圖輯 ── */
  function plays() {
    var playImg = X.playImg || {};
    var figs = D.plays.map(function (p) {
      var slug = playImg[p.name];
      var url = slug ? imgUrl(slug, 900) : '';
      var ph = url ? '<img src="' + url + '" alt="' + esc(p.name) + '" loading="lazy" />' : '';
      return '<figure>' + ph
        + '<figcaption><div class="nm">' + esc(p.name) + '</div>'
        + '<p class="ds">' + esc(p.text) + '</p></figcaption></figure>';
    }).join('');
    return '<section class="section" id="plays">'
      + '<h2>景點圖輯</h2>'
      + '<div class="play-grid">' + figs + '</div>'
      + '</section>';
  }

  /* ── 玩法 ── */
  function howto() {
    if (!X.howto) return '';
    var col = function (title, items) {
      return '<div><h3>' + esc(title) + '</h3><ul>'
        + (items || []).map(function (i) {
          return '<li><strong>' + esc(i.t) + '</strong><span>' + esc(i.d) + '</span></li>';
        }).join('') + '</ul></div>';
    };
    return '<section class="section howto" id="howto">'
      + '<h2>玩法</h2>'
      + '<div class="cols-2">'
      + col('第一次來，這樣玩不會錯', X.howto.first)
      + col('想玩深一點，像在地人', X.howto.deep)
      + '</div></section>';
  }

  /* ── 提醒 ── */
  function tips() {
    return '<section class="section" id="tips">'
      + '<h2>實用提醒</h2>'
      + '<ol class="tips">' + D.tips.map(function (t) {
        return '<li><span>' + esc(t) + '</span></li>';
      }).join('') + '</ol>'
      + '</section>';
  }

  /* ── Ft4 · Colophon ── */
  function colophon() {
    var credits = (typeof CREDITS !== 'undefined' ? CREDITS : []).map(function (c) {
      return esc(c.title) + ' — ' + esc(c.artist) + '（' + esc(c.license) + '，'
        + '<a href="' + esc(c.source) + '" target="_blank" rel="noopener">來源</a>）';
    }).join('　·　');
    return '<p>福岡五日 · 五天四夜行程誌 · 2027年3月9日（週二）–3月13日（週六）。'
      + '內容為旅遊規劃建議，行程節奏與店家為個人推薦；營業時間、票價與列車時刻'
      + '（尤其由布院之森訂位、太宰府梅花花況）以官方最新資訊為準。行程資訊查證於 2026 年 10 月。</p>'
      + '<p>字體 — Fraunces · Noto Serif TC · Noto Sans TC · IBM Plex Mono（Google Fonts）。</p>'
      + '<p>照片 — Wikimedia Commons：' + credits + '。</p>';
  }

  document.getElementById('main').innerHTML =
    opening() + itinerary() + news() + eats() + plays() + howto() + tips();
  document.getElementById('colophon').innerHTML = colophon();

  /* 深淺色切換（沿用原功能） */
  var toggle = document.getElementById('themeToggle');
  var stored = null;
  try { stored = localStorage.getItem('theme'); } catch (err) { /* 隱私模式下忽略 */ }
  if (stored) document.documentElement.setAttribute('data-theme', stored);

  toggle.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    if (!cur) {
      cur = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (err) { /* 忽略 */ }
  });
})();
</script>
</body>
</html>
