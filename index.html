<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gary-tour-test · GitHub Pages 測試頁</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #1a2a6c, #2a5298);
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 3rem 4rem;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    h1 { margin: 0 0 0.5rem; font-size: 2rem; }
    p { margin: 0.25rem 0; opacity: 0.85; }
    .badge {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: #22c55e;
      color: #06280f;
      font-weight: 700;
    }
    code {
      background: rgba(0, 0, 0, 0.3);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🚀 GitHub Pages 部署測試</h1>
    <p>這是 <code>gary-tour-test</code> 專案的靜態 HTML 測試頁面。</p>
    <p>由 GitHub Actions 自動部署。</p>
    <span class="badge">✅ 部署成功</span>
  </main>
</body>
